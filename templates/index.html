<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Classification Model</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=11">
    <link rel="stylesheet" href="/static/lang_toggle.css?v=2">
</head>
<body>

    <!-- Animated background -->
    <div class="bg-wrap">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Language Toggle -->
    <div class="lang-toggle-wrapper">
        <span class="lang-label" id="label-en">EN</span>
        <label class="lang-switch" for="langToggle">
            <input type="checkbox" id="langToggle">
            <span class="lang-slider"></span>
        </label>
        <span class="lang-label" id="label-tr">TR</span>
    </div>

    <div class="page-wrap">

        <!-- Hero Section -->
        <header class="hero">
            <div class="hero-badge">
                <span class="badge-dot"></span>
                <span data-en="PyTorch Neural Network" data-tr="PyTorch Sinir Ağı">PyTorch Neural Network</span>
            </div>
            <h1>
                <span class="title-light" data-en="Iris" data-tr="Iris">Iris</span>
                <span class="title-bold" data-en="Classifier" data-tr="Sınıflandırıcı">Classifier</span>
            </h1>
            <p class="hero-sub"
               data-en="Enter four measurements and let our deep learning model identify the species in real time."
               data-tr="Dört ölçüm girin ve derin öğrenme modelimiz türü gerçek zamanlı olarak belirlesin.">
               Enter four measurements and let our deep learning model identify the species in real time.
            </p>

            <!-- Species Preview Pills -->
            <div class="species-pills">
                <div class="pill pill-setosa">🌹 Setosa</div>
                <div class="pill pill-versicolor">💜 Versicolor</div>
                <div class="pill pill-virginica">🌿 Virginica</div>
            </div>
        </header>

        <main>
            <!-- Input Card -->
            <div class="card form-card">
                <div class="card-header">
                    <div class="card-icon">📐</div>
                    <div>
                        <div class="card-title" data-en="Measurements" data-tr="Ölçümler">Measurements</div>
                        <div class="card-sub" data-en="All values in centimeters" data-tr="Tüm değerler santimetre cinsinden">All values in centimeters</div>
                    </div>
                </div>

                <form id="predictionForm">
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="sepal_length" data-en="Sepal Length" data-tr="Çanak Yaprak Uzunluğu">Sepal Length</label>
                            <div class="input-wrap">
                                <input type="number" step="0.1" min="0" id="sepal_length" required placeholder="5.1">
                                <span class="unit">cm</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="sepal_width" data-en="Sepal Width" data-tr="Çanak Yaprak Genişliği">Sepal Width</label>
                            <div class="input-wrap">
                                <input type="number" step="0.1" min="0" id="sepal_width" required placeholder="3.5">
                                <span class="unit">cm</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="petal_length" data-en="Petal Length" data-tr="Taç Yaprak Uzunluğu">Petal Length</label>
                            <div class="input-wrap">
                                <input type="number" step="0.1" min="0" id="petal_length" required placeholder="1.4">
                                <span class="unit">cm</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="petal_width" data-en="Petal Width" data-tr="Taç Yaprak Genişliği">Petal Width</label>
                            <div class="input-wrap">
                                <input type="number" step="0.1" min="0" id="petal_width" required placeholder="0.2">
                                <span class="unit">cm</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="predictBtn">
                        <span id="btnText" data-en="Classify Species" data-tr="Türü Sınıflandır">Classify Species</span>
                        <div class="spinner hidden" id="spinner"></div>
                        <span class="btn-arrow" id="btnArrow">→</span>
                    </button>
                </form>
            </div>

            <!-- Result Card -->
            <div id="resultCard" class="card result-card hidden">
                <div class="result-glow" id="resultGlow"></div>
                <div class="result-top">
                    <div class="result-label" data-en="Identified Species" data-tr="Tespit Edilen Tür">Identified Species</div>
                    <div class="result-emoji" id="resultEmoji">🌸</div>
                </div>
                <div class="result-species" id="speciesResult"></div>
                <div class="result-desc" id="speciesDesc"></div>

                <div class="confidence-block">
                    <div class="conf-header">
                        <span data-en="Confidence Score" data-tr="Güven Skoru">Confidence Score</span>
                        <span class="conf-pct" id="confidenceValue"></span>
                    </div>
                    <div class="conf-track">
                        <div class="conf-fill" id="confidenceFill"></div>
                    </div>
                </div>

                <!-- Mini probability bars -->
                <div class="prob-grid" id="probGrid"></div>
            </div>
        </main>

        <footer class="site-footer">
            <span data-en="Built with FastAPI + PyTorch" data-tr="FastAPI + PyTorch ile yapıldı">Built with FastAPI + PyTorch</span>
        </footer>
    </div>

    <script src="/static/script.js?v=10"></script>
</body>
</html>
